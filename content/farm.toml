# ============================================================================
# 4. OPTIONAL ONLINE STORE (Hidden while `enabled = false`)
# Flip `enabled = true` later if you'd like to display items for pre-order.
# ============================================================================
[store]
enabled = false
heading = "Farmstand Pre-Orders"
subtitle = "Reserve online for Thursday Barnstand pickup (2:00 – 6:00 PM at 2590 Edison Street, Graton)."

[[store.products]]
name = "Weekly Harvest Box"
price = "$35"
description = "A seasonal mix of fresh-picked organic vegetables, greens, herbs, and fruit."
image = "/images/instagram/farmstand-table.jpg"
checkout_url = "mailto:amie@hopyardfarm.org?subject=Harvest%20Box%20Reservation"
cta_text = "Reserve Box"
